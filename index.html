<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#11141B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokédex">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pokédex Printings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky bar (brand, search, Binder link, generation chips) over a Pokédex tile grid.
   A Pokémon opens a page of binder-style pockets, one per printing; a card opens a viewer.
   The Binder page lays the owned cards out in Pokédex order, one binder page at a time. */
:root{
  --bg:#E6E9EF; --surface:#FFFFFF; --surface-2:#F1F3F8; --sleeve:#D8DDE7;
  --ink:#141A26; --muted:#586174; --line:#CBD1DD;
  --accent:#D4302C; --accent-ink:#FFFFFF; --focus:#2F5BEA; --scrim:rgba(14,18,28,.78);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cw:150px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11141B; --surface:#1A1F29; --surface-2:#202632; --sleeve:#2A3140;
    --ink:#E8EBF2; --muted:#9AA3B6; --line:#2E3646;
    --accent:#FF5B52; --accent-ink:#1A0605; --focus:#7C9BFF; --scrim:rgba(4,6,10,.84);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-row{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:600 18px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--accent);font-weight:700}
.ball{width:22px;height:22px;border-radius:50%;flex:none;position:relative;border:2px solid var(--ink);background:linear-gradient(var(--accent) 0 44%,var(--ink) 44% 56%,var(--surface) 56%)}
.ball::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.bar-right{display:flex;align-items:center;gap:10px;flex:1;min-width:0;justify-content:flex-end}
.search{flex:1;min-width:0;max-width:420px}
.search input{width:100%;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit}
.search input::placeholder{color:var(--muted)}
.navlink{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);text-decoration:none;font:600 14px/1 var(--f-body);white-space:nowrap}
.navlink i{font:500 11px/1 var(--f-mono);font-style:normal;color:var(--accent-ink);background:var(--accent);padding:3px 6px;border-radius:999px}
.navlink[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;padding-block:2px 10px}
.chips.scroll{overflow-x:auto;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:500 13px/1 var(--f-body);cursor:pointer}
.chip i{font:400 11px/1 var(--f-mono);font-style:normal;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] i{color:inherit;opacity:.75}
.chips.wrap{flex-wrap:wrap;padding-block:0}

main{padding-block:18px 36px}
.state{padding:40px 0;color:var(--muted);text-align:center}
.state button,.state a{color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:600 14px/1 var(--f-body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.field select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.field input[type=range]{width:120px;accent-color:var(--accent)}

/* home */
.home-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.home-tools{display:flex;align-items:center;gap:14px}
h1{margin:0;font:700 28px/1.05 var(--f-display);letter-spacing:-.02em}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none}
.tile:hover{border-color:var(--accent)}
.tile.has{border-color:var(--accent)}
.tile.has::after{content:"✓";position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 11px/18px var(--f-body);text-align:center}
.tile img{width:96px;height:96px;object-fit:contain}
.tile img.px{image-rendering:pixelated}
.tile .no{font:400 11px/1.6 var(--f-mono);color:var(--muted)}
.tile .nm{max-width:100%;font:600 13px/1.25 var(--f-body);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pokemon page */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;margin-bottom:16px}
.crumbs a{text-decoration:none;color:var(--muted);font-weight:500}
.crumbs a:hover{color:var(--ink)}
.crumbs .back{color:var(--ink);font-weight:600}
.crumbs .pn{display:flex;gap:16px;min-width:0}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.hero-art{width:112px;height:112px;object-fit:contain;flex:none}
.dexno{margin:0 0 4px;font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(30px,7vw,46px);text-wrap:balance}
.hero-meta{margin:8px 0 0;color:var(--muted);font-size:14px}
.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.status{min-height:20px;margin:0 0 10px;font:400 12px/1.6 var(--f-mono);color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:12px}
.pocket{position:relative;display:flex;flex-direction:column;gap:7px;min-width:0;padding:8px 8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.pocket:hover{border-color:var(--muted)}
.pocket.owned{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pk-link{display:flex;flex-direction:column;gap:7px;min-width:0;text-decoration:none}
.pocket .art{display:block;aspect-ratio:245/337;border-radius:4.5% / 3.3%;overflow:hidden;background:var(--sleeve)}
.pocket img{display:block;width:100%;height:100%;object-fit:cover}
.pk-btns{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px}
.pk-btns button{width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 18px/1 var(--f-body);cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pk-btns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pk-btns svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.noimg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center;font-weight:600;font-size:13px}
.noimg small{font-weight:400;color:var(--muted)}
.set{font:600 13px/1.25 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{display:flex;flex-wrap:wrap;gap:2px 8px;font:400 11px/1.4 var(--f-mono);color:var(--muted)}
.cap .art-r{color:var(--accent)}
.cap .price{color:var(--ink);font-weight:500}
.foot{padding-block:8px 28px;font-size:12px;color:var(--muted);text-align:center}

/* viewer */
.lb{position:fixed;inset:0;z-index:50;background:var(--scrim);overflow-y:auto;overscroll-behavior:contain;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.lb-panel{position:relative;max-width:900px;margin:0 auto;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start;padding:44px 22px 22px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.lb-img{aspect-ratio:245/337;border-radius:4.5% / 3.3%;overflow:hidden;background:var(--sleeve)}
.lb-img img{display:block;width:100%;height:100%;object-fit:cover}
.lb-x,.lb-nav{position:absolute;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:500 22px/1 var(--f-body);cursor:pointer;display:grid;place-items:center}
.lb-x{top:10px;right:10px}
.lb-nav.prev{top:10px;left:10px}
.lb-nav.next{top:10px;left:58px}
.lb-info h2{margin:0 0 4px;font:700 26px/1.1 var(--f-display);letter-spacing:-.01em}
.lb-info .sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.lb-actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.lb-info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px}
.lb-info dt{color:var(--muted)}
.lb-info dd{margin:0;min-width:0}
.lb-info .tags{display:flex;flex-wrap:wrap;gap:6px}
.lb-info .note{margin:12px 0 0;font-size:12px;color:var(--muted)}
.tag{padding:3px 9px;border:1px solid var(--line);border-radius:999px;font:400 12px/1.4 var(--f-mono)}
.lb-logo{max-width:130px;max-height:46px;margin-top:18px;display:block}
html.lb-open{overflow:hidden}

/* binder */
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:10px}
.bsum{margin:0 0 10px;color:var(--muted);font-size:14px}
.bsum b{color:var(--ink);font-weight:600}
.bprog{height:6px;border-radius:999px;background:var(--sleeve);overflow:hidden;margin-bottom:14px}
.bprog span{display:block;height:100%;background:var(--accent)}
.bnote{margin:0 0 16px;font-size:13px;color:var(--muted)}
.bpages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px;margin-top:18px}
.bpage{scroll-margin-top:130px;padding:12px 12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.bpage h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 14px/1.2 var(--f-display)}
.bpage h3 span{font:400 12px/1 var(--f-mono);color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(var(--bc,3),minmax(0,1fr));gap:8px}
.slot{position:relative;display:block;aspect-ratio:245/337;border-radius:4.5% / 3.3%;overflow:hidden;background:var(--sleeve);text-decoration:none}
.slot img{display:block;width:100%;height:100%;object-fit:cover}
.slot.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;border:1.5px dashed var(--line);border-radius:6px}
.slot.empty img{width:58%;height:auto;aspect-ratio:1;object-fit:contain;opacity:.45;filter:grayscale(1);image-rendering:pixelated}
.sl-no{position:absolute;left:4px;bottom:4px;padding:2px 4px;border-radius:4px;background:rgba(0,0,0,.6);color:#fff;font:500 10px/1 var(--f-mono)}
.slot.empty .sl-no{position:static;background:none;color:var(--muted)}
.sl-nm{max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--muted)}
.more{position:absolute;right:4px;top:4px;padding:2px 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 10px/1 var(--f-mono)}
.slot-txt{display:grid;place-items:center;height:100%;padding:6px;text-align:center;font-size:11px;font-weight:600}
.backup{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.backup h2{margin:0 0 6px;font:700 20px/1.2 var(--f-display)}
.backup p{margin:0 0 12px;font-size:14px;color:var(--muted);max-width:60ch}
.btn.file:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.jump{width:84px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}

a.chip{text-decoration:none}
.chip[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-current="page"] i{color:inherit;opacity:.75}
.chip.add{border-style:dashed}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.bsel{height:36px;max-width:200px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.lb-actions .bsel{height:40px}
.bctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:14px 0}
.bname,.colq{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
.bname{width:200px;font-weight:600}
.colq{width:260px;max-width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.linkbtn{padding:0;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.bk{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.slot.blank{background:transparent;border:1.5px dashed var(--line);border-radius:6px;opacity:.45}
.cap .lang{color:var(--ink)}
.cf{position:fixed;inset:0;z-index:55;background:var(--scrim);overflow-y:auto;overscroll-behavior:contain;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px))}
.cf-panel{max-width:640px;margin:0 auto;padding:22px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.cf-panel h2{margin:0 0 4px;font:700 22px/1.15 var(--f-display)}
.cf-panel .lead{margin:0 0 16px;color:var(--muted);font-size:13px}
.ff-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.ff{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13px;color:var(--muted)}
.ff.wide{grid-column:1/-1}
.ff input,.ff textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit}
.ff input[type=file]{padding:6px}
.ff small{font-size:12px;color:var(--muted)}
.cf-photo{display:flex;gap:14px;align-items:flex-start}
.cf-prev{flex:none;width:92px;aspect-ratio:245/337;border-radius:4.5% / 3.3%;overflow:hidden;background:var(--sleeve);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--muted)}
.cf-prev img{display:block;width:100%;height:100%;object-fit:cover}
.cf-photo .ff{flex:1}
.cf-checks{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cf-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
@media (max-width:560px){.ff-grid{grid-template-columns:1fr}.bname{width:100%}}
.tg-acts{display:flex;flex-wrap:wrap;gap:6px}
.tg-acts .btn{flex:1 1 auto;padding:0 10px}
.tg-acts .x{flex:none;width:34px;padding:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:14px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,460px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;text-align:center}

@media (max-width:640px){
  .lb-panel{grid-template-columns:1fr;padding-top:60px}
  .lb-img{max-width:320px;margin:0 auto;width:100%}
  .hero{gap:14px}
  .hero-art{width:88px;height:88px}
}
@media (max-width:520px){
  .brand-t{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .tile,.pocket{transition:border-color .12s}
}
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="pad">
    <div class="bar-row">
      <a class="brand" href="#/" aria-label="Pokédex Printings, home"><span class="ball" aria-hidden="true"></span><span class="brand-t">Pokédex <b>Printings</b></span></a>
      <div class="bar-right">
        <label class="search" id="searchWrap" hidden>
          <span class="sr">Search Pokémon by name or number</span>
          <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Search name or number">
        </label>
        <a class="navlink" id="binderLink" href="#/binder">My cards <i id="binderCount">0</i></a>
      </div>
    </div>
    <nav class="chips scroll" id="genChips" aria-label="Generation" hidden></nav>
  </div>
</header>

<main class="pad" id="main">
  <div id="boot" class="state">Loading the Pokédex…</div>

  <section id="home" hidden>
    <div class="home-head">
      <h1>Pokédex</h1>
      <div class="home-tools">
        <label class="field"><span class="sr">Show</span>
          <select id="ownFilter">
            <option value="all">All Pokémon</option>
            <option value="have">In my collection</option>
            <option value="missing">Not in my collection</option>
          </select>
        </label>
        <span id="homeCount" class="muted mono"></span>
      </div>
    </div>
    <p id="bkNote" class="bnote bk" hidden></p>
    <div id="grid" class="dex"></div>
    <p id="homeEmpty" class="state" hidden>No Pokémon match that search.</p>
  </section>

  <section id="poke" hidden></section>
  <section id="binder" hidden></section>
</main>

<footer class="foot pad">Card data and prices from TCGdex (prices are TCGplayer market prices) · Pokémon list and artwork from PokéAPI</footer>

<div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="Card viewer">
  <div class="lb-panel" id="lbPanel">
    <button type="button" class="lb-nav prev" id="lbPrev" aria-label="Previous card">‹</button>
    <button type="button" class="lb-nav next" id="lbNext" aria-label="Next card">›</button>
    <button type="button" class="lb-x" id="lbClose" aria-label="Close card viewer">×</button>
    <div class="lb-img" id="lbImg"></div>
    <div class="lb-info" id="lbInfo"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<noscript><p class="state">This app needs JavaScript.</p></noscript>

<script>
(() => {
'use strict';

/* ---------- config ---------- */
const API = 'https://api.tcgdex.net/v2/en';
const PTCG = 'https://api.pokemontcg.io/v2';
const SPECIES_URL = 'https://pokeapi.co/api/v2/pokemon-species?limit=3000';
const IMG = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const SPRITE = id => `${IMG}${id}.png`;
const ART = id => `${IMG}other/official-artwork/${id}.png`;
const DAY = 864e5;
const GENS = [

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

async function getJSON(url, { tries = 3, timeout = 20000 } = {}) {
  let last;
  for (let i = 0; i < tries; i++) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout);
    try {
      const res = await fetch(url, { signal: ctl.signal });
      if (res.status === 404) { const e = new Error('Not found'); e.status = 404; throw e; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      last = e;
      if (e.status === 404) break;
      await sleep(400 * (i + 1));
    } finally { clearTimeout(t); }
  }
  throw last;
}

async function pool(items, limit, worker, alive) {
  let i = 0;
  const runners = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length && alive()) {
      const it = items[i++];
      try { await worker(it); } catch { /* skip, keep going */ }
    }
  });
  await Promise.all(runners);
}

const priceLabel = k => PRICE_LABEL[k] || String(k).replace(/[-_]/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, m => m.toUpperCase());

function pricesOf(c) {
  const raw = c.pre ? (c.prices || []) : ((S.details[c.id] || [])[2] || []);
  return raw.slice().sort((a, b) => {
    const ia = PRICE_ORDER.indexOf(a[0]), ib = PRICE_ORDER.indexOf(b[0]);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}
const primaryPrice = c => { const p = pricesOf(c).find(x => typeof x[1] === 'number'); return p ? p[1] : null; };

function fmtDate(s) {
  const d = new Date(s);

function parsePricing(c) {
  const t = c.pricing && c.pricing.tcgplayer;
  if (!t || typeof t !== 'object') return null;
  const p = [];
  for (const [k, v] of Object.entries(t)) {
    if (v && typeof v === 'object' && !Array.isArray(v)) p.push([k, typeof v.marketPrice === 'number' ? v.marketPrice : null]);
  }
  return { p, u: t.updated || '' };
}
function tcgUrl(c) {
  if (c.tcgUrl) return c.tcgUrl;
  const q = c.name + ' ' + numLabel(c).replace(/^#/, '');
  return 'https://www.tcgplayer.com/search/pokemon/product?productLineName=pokemon&view=grid&q=' + encodeURIComponent(q);

const queryTerm = name => (name.match(/[A-Za-z0-9]+/g) || [name]).reduce((a, b) => (b.length > a.length ? b : a), '');

function setIdOf(c) {
  const lid = String(c.localId ?? '');
  return lid && c.id.endsWith('-' + lid) ? c.id.slice(0, -(lid.length + 1)) : c.id.replace(/-[^-]*$/, '');

const isPocketCard = (c, pocket) => {
  const sid = setIdOf(c);
  return pocket.has(sid) || POCKET_RE.test(sid) || /\/tcgp\//.test(c.image || '');
};

function normCard(c) {

function normPtcg(c) {

}

/* TCGdex: filter by card name on the server, then keep only cards whose name really contains this Pokémon */
async function loadFromTcgdex(sp) {
  const pocket = await S.pocketReady;
  const term = queryTerm(sp.name), tl = term.toLowerCase(), per = 100, seen = new Map();
  for (let page = 1; page <= 15; page++) {
    let arr;
    try {
      arr = await getJSON(`${API}/cards?name=${encodeURIComponent(term)}&pagination:page=${page}&pagination:itemsPerPage=${per}`);
    } catch (e) {
      if (e.status === 404 || page > 1) break;
      throw e;
    }
    if (!Array.isArray(arr)) throw new Error('Unexpected response from the card database');
    if (page === 1 && arr.length >= 50) {
      const hit = arr.filter(c => (c.name || '').toLowerCase().includes(tl)).length;
      if (hit < arr.length * 0.5) throw new Error('The card database ignored the name filter');
    }
    const before = seen.size;
    for (const c of arr) if (c && c.id) seen.set(c.id, c);
    if (arr.length < per || seen.size === before) break;
  }
  const needle = ' ' + norm(sp.name) + ' ';
  let list = [...seen.values()].filter(c => (' ' + norm(c.name || '') + ' ').includes(needle));
  const sym = SYMBOL[sp.slug];
  if (sym) { const strict = list.filter(c => (c.name || '').includes(sym)); if (strict.length) list = strict; }
  const physical = list.filter(c => !isPocketCard(c, pocket));
  return { cards: physical.map(normCard), how: 'tcgdex', hidden: list.length - physical.length };
}

/* Pokémon TCG API: filters by national Pokédex number; includes rarity, artist, prices and a TCGplayer link */
async function loadFromPtcg(sp, { quick = false } = {}) {
  const per = 100, out = [];
  let total = Infinity;
  for (let page = 1; page <= 15 && out.length < total; page++) {
    const r = await getJSON(
      `${PTCG}/cards?q=${encodeURIComponent('nationalPokedexNumbers:' + sp.id)}&pageSize=${per}&page=${page}`,
      quick ? { tries: 1, timeout: 12000 } : { tries: 2, timeout: 30000 });
    if (!r || !Array.isArray(r.data)) throw new Error('Unexpected response from the Pokémon TCG API');
    total = typeof r.totalCount === 'number' ? r.totalCount : r.data.length;
    out.push(...r.data);
    if (r.data.length < per) break;
  }
  return { cards: out.map(normPtcg), how: 'ptcg', hidden: 0 };
}

async function loadCards(sp) {
  if (S.cards.has(sp.id)) return S.cards.get(sp.id);
  let res, tErr;
  try { res = await loadFromTcgdex(sp); } catch (e) { tErr = e; }
  if (!res || !res.cards.length) {
    try {
      const alt = await loadFromPtcg(sp, { quick: !tErr });
      if (alt.cards.length || tErr) res = alt;
    } catch (e) {
      if (tErr) throw new Error(`${tErr.message}; the backup source also failed (${e.message})`);
    }
  }
  S.cards.set(sp.id, res);
  return res;
}

const illustratorOf = c => (c.pre ? c.artist : (S.details[c.id] ? S.details[c.id][1] : ''));
const glyph = r => { const x = (r || '').toLowerCase(); if (!x || x === 'none') return ''; if (x === 'common') return '●'; if (x === 'uncommon') return '◆'; return '★'; };
const isArtRare = r => /illustration|shiny|full art|alternate art|art rare/i.test(r || '');

  const t = c.set ? c.set.total : (S.setsById.get(c.setId) || {}).total;

function sortCards(v) {
  const asc = v.sort === 'old';
  return v.cards.slice().sort((a, b) => {
    if (v.sort === 'price') {
      const pa = primaryPrice(a), pb = primaryPrice(b);
      if (pa !== pb) {
        if (pa == null) return 1;
        if (pb == null) return -1;
        return pb - pa;
      }
    }
    const da = dateOf(a), db = dateOf(b);
    if (da !== db) {
      if (!da) return 1;
      if (!db) return -1;
      return (da < db ? -1 : 1) * (asc ? 1 : -1);
    }
    if (a.setId !== b.setId) {
      const ia = S.setIndex.get(a.setId) ?? 1e9, ib = S.setIndex.get(b.setId) ?? 1e9;
      if (ia !== ib) return (ia - ib) * (asc ? 1 : -1);
      return a.setId < b.setId ? -1 : 1;
    }
    return a.localId.localeCompare(b.localId, undefined, { numeric: true });
  });
}

function visibleCards(v) {
  let list = sortCards(v);
  if (v.rarity === '__art') list = list.filter(c => isArtRare(rarityOf(c)));
  else if (v.rarity) list = list.filter(c => rarityOf(c) === v.rarity);
  if (v.own === 'have') list = list.filter(c => COL[c.id]);
  else if (v.own === 'missing') list = list.filter(c => !COL[c.id]);
  else if (v.own === 'target') list = list.filter(c => TGT[c.id]);
  else if (v.own === 'binder') { const b = activeB(); list = list.filter(c => inB(b, c.id)); }
  return list;
}

/* ---------- my cards: collection, binders and custom printings (all saved in this browser) ---------- */
const MAXB = 6;                                    // most rows or columns a binder page can have
const clampN = (n, d) => { n = Math.round(+n); return n >= 1 && n <= MAXB ? n : d; };
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const str = (x, n) => String(x == null ? '' : x).slice(0, n);
const httpUrl = u => (typeof u === 'string' && /^https?:\/\//.test(u) ? u.slice(0, 1000) : '');

let COL = {};                                      // cardId -> {d,n,s,y,no,r,th,p,t,cu}   cards I own
let BND = { active: '', list: [] };                // binders: {id,name,rows,cols,ph,cards:[cardId]}
let TGT = {};                                      // cards I am hunting for: cardId -> same record shape as COL
let CUS = {};                                      // printings I added by hand: cardId -> {d,n,s,no,y,l,r,a,p,u,note,t}
const IMGS = new Map();                            // custom cardId -> photo (data URL)

/* photos of custom cards live in IndexedDB (no 5 MB limit); localStorage is the fallback */
const ImgStore = {
  db: null,
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('pdx1-img', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('img');
        r.onsuccess = () => res(r.result);
        r.onerror = r.onblocked = () => rej(r.error || new Error('blocked'));
      });
      await new Promise((res, rej) => {
        const q = this.db.transaction('img').objectStore('img').openCursor();
        q.onsuccess = () => { const c = q.result; if (c) { IMGS.set(String(c.key), c.value); c.continue(); } else res(); };
        q.onerror = () => rej(q.error);
      });
    } catch { this.db = null; }
    try {
      const pre = 'pdx1:img:';
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(pre)) { const v = LS.get(k.slice(5), null); if (typeof v === 'string') IMGS.set(k.slice(pre.length), v); }
      }
    } catch { /* ignore */ }
  },
  async put(id, data) {
    IMGS.set(id, data);
    if (this.db) {
      try {
        await new Promise((res, rej) => {
          const t = this.db.transaction('img', 'readwrite');
          t.objectStore('img').put(data, id);
          t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error);
        });
        LS.del('img:' + id);
        return true;
      } catch { /* fall through to localStorage */ }
    }
    return LS.set('img:' + id, data);
  },
  async del(id) {
    IMGS.delete(id);
    LS.del('img:' + id);
    if (this.db) {
      try {
        await new Promise((res, rej) => {
          const t = this.db.transaction('img', 'readwrite');
          t.objectStore('img').delete(id);
          t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error);
        });
      } catch { /* ignore */ }
    }
  }
};

function cleanRec(r) {
  if (!r || typeof r !== 'object' || typeof r.d !== 'number' || typeof r.n !== 'string') return null;
  return {
    d: r.d, n: str(r.n, 80), s: str(r.s, 80), y: str(r.y, 4), no: str(r.no, 20), r: str(r.r, 60), th: httpUrl(r.th),
    p: typeof r.p === 'number' ? r.p : null, t: +r.t || Date.now(), cu: r.cu ? 1 : 0
  };
}
function cleanBinder(b) {
  if (!b || typeof b !== 'object' || typeof b.id !== 'string' || !b.id) return null;
  return {
    id: b.id.slice(0, 40), name: str(b.name, 40).trim() || 'Binder', rows: clampN(b.rows, 3), cols: clampN(b.cols, 3), ph: !!b.ph,
    cards: (Array.isArray(b.cards) ? b.cards : []).filter(x => typeof x === 'string').slice(0, 20000)
  };
}
function cleanCus(r) {
  if (!r || typeof r !== 'object' || typeof r.d !== 'number' || typeof r.n !== 'string' || !r.n.trim()) return null;
  return {
    d: r.d, n: str(r.n, 80).trim(), s: str(r.s, 80).trim(), no: str(r.no, 20).trim(), y: /^\d{4}$/.test(String(r.y)) ? String(r.y) : '',
    l: str(r.l, 40).trim(), r: str(r.r, 60).trim(), a: str(r.a, 80).trim(),
    p: typeof r.p === 'number' && r.p >= 0 ? r.p : null, u: httpUrl(r.u), note: str(r.note, 400).trim(), t: +r.t || Date.now()
  };
}

function loadMine() {
  CUS = {};
  for (const [id, r] of Object.entries(LS.get('cus', {}) || {})) { const c = cleanCus(r); if (c) CUS[id] = c; }
  let col = LS.get('col', null), migrated = false;
  if (!col || typeof col !== 'object') { col = LS.get('own', {}) || {}; migrated = true; }   // earlier version: one binder, saved as "own"
  COL = {};
  for (const [id, r] of Object.entries(col)) { const c = cleanRec(r); if (c) COL[id] = c; }
  TGT = {};
  for (const [id, r] of Object.entries(LS.get('tgt', {}) || {})) { const c = cleanRec(r); if (c && !COL[id]) TGT[id] = c; }
  const saved = LS.get('bnd', null);
  const list = saved && Array.isArray(saved.list) ? saved.list.map(cleanBinder).filter(Boolean) : [];
  let fresh = false;
  if (!list.length) {
    const per = LS.get('bpp', 9);
    const b = { id: 'b1', name: 'My binder', rows: per === 4 ? 2 : 3, cols: per === 4 ? 2 : per === 12 ? 4 : 3, ph: true, cards: [] };
    if (migrated) b.cards = Object.keys(COL).sort((x, y) => COL[x].d - COL[y].d || COL[x].t - COL[y].t);
    list.push(b); fresh = true;
  }
  BND = { active: saved && list.some(b => b.id === saved.active) ? saved.active : list[0].id, list };
  if (migrated || fresh) { saveCol(); saveBnd(); }
}

function rebuildOwn() {
  S.ownByDex = new Map();
  for (const [id, r] of Object.entries(COL)) {
    if (!S.ownByDex.has(r.d)) S.ownByDex.set(r.d, []);
    S.ownByDex.get(r.d).push({ id, ...r });
  }
  for (const arr of S.ownByDex.values()) arr.sort((a, b) => b.t - a.t);
}

let saveWarned = false;
function persist(key, val) {
  const ok = LS.set(key, val);
  if (!ok && !saveWarned) { saveWarned = true; toast('This browser blocked saving. Use Download a backup on the My cards page to keep a copy.'); }
  return ok;
}
const saveCol = () => persist('col', COL);
const saveBnd = () => persist('bnd', BND);
const saveCus = () => persist('cus', CUS);
const saveTgt = () => persist('tgt', TGT);
let saveColT;
const saveColSoon = () => { clearTimeout(saveColT); saveColT = setTimeout(saveCol, 600); };
let saveTgtT;
const saveTgtSoon = () => { clearTimeout(saveTgtT); saveTgtT = setTimeout(saveTgt, 600); };

const activeB = () => BND.list.find(b => b.id === BND.active) || BND.list[0];
const inB = (b, id) => b.cards.includes(id);
const pruneBinders = () => { for (const b of BND.list) b.cards = b.cards.filter(id => COL[id]); };
const askPersist = () => { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); };

function updateBinderBadge() { $('#binderCount').textContent = Object.keys(COL).length; }
function refreshTileBadges() { for (const sp of S.species) sp.tile.classList.toggle('has', S.ownByDex.has(sp.id)); }

/* custom printings behave like any other card */
const customImg = id => IMGS.get(id) || (CUS[id] && CUS[id].u) || '';
function customCard(id) {
  const r = CUS[id], img = customImg(id) || null;
  return {
    id, localId: r.no, name: r.n, setId: 'c:', src: 'custom', custom: true, pre: true,
    thumb: img, thumbAlt: null, full: img, fullAlt: null,
    set: { name: r.s || 'Custom card', series: 'Added by me', total: 0, date: r.y ? r.y + '-01-01' : '', logo: null },
    rarity: r.r, artist: r.a, lang: r.l, note: r.note, finishes: [],
    prices: typeof r.p === 'number' ? [['custom', r.p]] : [], priceUpdated: '', tcgUrl: ''
  };
}
const customsFor = d => Object.keys(CUS).filter(id => CUS[id].d === d).map(customCard);

function recFor(c, dex) {
  return {
    d: dex, n: c.name, s: setName(c), y: yearOf(c), no: numLabel(c), r: rarityOf(c) || '',
    th: c.custom ? '' : (c.thumb || ''), p: primaryPrice(c), t: Date.now(), cu: c.custom ? 1 : 0
  };
}

function toggleCol(v, c) {
  if (COL[c.id]) {
    const names = BND.list.filter(b => inB(b, c.id)).map(b => '“' + b.name + '”');
    delete COL[c.id];
    pruneBinders();
    saveBnd();
    if (names.length) toast('Removed from your collection and from ' + names.join(', ') + '.');
  } else {
    COL[c.id] = recFor(c, v.id);
    if (TGT[c.id]) { delete TGT[c.id]; saveTgt(); }
    askPersist();
  }
  saveCol();
  afterChange(v, c);
}

function toggleBnd(v, c) {
  const b = activeB();
  if (inB(b, c.id)) b.cards = b.cards.filter(x => x !== c.id);
  else {
    if (!COL[c.id]) { COL[c.id] = recFor(c, v.id); saveCol(); }
    if (TGT[c.id]) { delete TGT[c.id]; saveTgt(); }
    b.cards.push(c.id);
    askPersist();
  }
  saveBnd();
  afterChange(v, c);
}

function toggleTgt(v, c) {
  if (COL[c.id]) return;
  if (TGT[c.id]) delete TGT[c.id]; else TGT[c.id] = recFor(c, v.id);
  saveTgt();
  afterChange(v, c);
}

function afterChange(v, c) {
  rebuildOwn();
  const el = v.pockets && v.pockets.get(c.id);

}

/* keep the saved price and rarity of collected cards current as fresh data arrives */
function syncOwned(c) {
  const p = primaryPrice(c), rar = rarityOf(c);
  for (const [map, save] of [[COL, saveColSoon], [TGT, saveTgtSoon]]) {
    const r = map[c.id];
    if (!r) continue;
    let changed = false;
    if (p !== r.p) { r.p = p; changed = true; }
    if (rar && rar !== r.r) { r.r = rar; changed = true; }
    if (changed) save();
  }
}

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    const end = (fn, val) => { clearTimeout(t); URL.revokeObjectURL(url); fn(val); };
    const t = setTimeout(() => end(reject, new Error('timeout')), 20000);
    img.onload = () => {
      try {
        const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
        if (!w0 || !h0) throw new Error('empty');
        const k = Math.min(1, 720 / Math.max(w0, h0));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w0 * k)); cv.height = Math.max(1, Math.round(h0 * k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        end(resolve, cv.toDataURL('image/jpeg', 0.82));
      } catch (e) { end(reject, e); }
    };
    img.onerror = () => end(reject, new Error('unreadable'));
    img.src = url;
  });
}

function exportAll() {

  const data = {
    app: 'pokedex-printings', version: 2, exported: new Date().toISOString(),
    collection: COL, targets: TGT, binders: BND.list, active: BND.active, custom: CUS, images
  };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });

  document.body.append(a); a.click(); a.remove();

  toast(`Backed up ${Object.keys(COL).length} cards, ${BND.list.length} binder${BND.list.length === 1 ? '' : 's'} and ${Object.keys(CUS).length} custom printing${Object.keys(CUS).length === 1 ? '' : 's'}.`);
  updateBackupNote();

}

function importFile(e) {
  const input = e.target, f = input.files && input.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const data = JSON.parse(fr.result);
      const v2 = data && data.collection && typeof data.collection === 'object' ? data.collection : null;
      const cards = v2 || (data && data.cards && typeof data.cards === 'object' ? data.cards : data);
      if (!cards || typeof cards !== 'object') throw new Error('bad');
      let added = 0, bad = 0;
      for (const [id, r] of Object.entries(cards)) {
        const rec = cleanRec(r);
        if (!rec) { bad++; continue; }
        if (!COL[id]) { COL[id] = rec; added++; }
        else if (rec.t > (COL[id].t || 0)) COL[id] = rec;
      }
      if (v2) {
        for (const [id, r] of Object.entries(data.custom || {})) { const c = cleanCus(r); if (c && (!CUS[id] || c.t > CUS[id].t)) CUS[id] = c; }
        for (const [id, img] of Object.entries(data.images || {})) {
          if (CUS[id] && typeof img === 'string' && /^data:image\//.test(img) && !IMGS.has(id)) await ImgStore.put(id, img);
        }
        for (const raw of Array.isArray(data.binders) ? data.binders : []) {
          const b = cleanBinder(raw);
          if (!b) continue;
          const mine = BND.list.find(x => x.id === b.id);
          if (mine) { for (const id of b.cards) if (!mine.cards.includes(id)) mine.cards.push(id); }
          else if (BND.list.length < 30) BND.list.push(b);
        }
      } else {
        const b = activeB();   // an export from the earlier single-binder version: those cards were in the binder
        for (const id of Object.keys(cards)) if (COL[id] && !b.cards.includes(id)) b.cards.push(id);
      }
      if (v2) for (const [id, r] of Object.entries(data.targets || {})) { const rec = cleanRec(r); if (rec && !COL[id] && !TGT[id]) TGT[id] = rec; }
      for (const id of Object.keys(TGT)) if (COL[id]) delete TGT[id];
      pruneBinders();
      saveCol(); saveBnd(); saveCus(); saveTgt();
      rebuildOwn(); refreshTileBadges(); updateBinderBadge(); refreshBsels(); updateBackupNote();
      if (V && V.cards) { V.cards = V.cards.filter(c => !c.custom).concat(customsFor(V.id)); renderGallery(V); buildChips(V); updateMeta(V); }
      if (mode === 'binder') renderBinder();
      toast(`Imported: ${added} new card${added === 1 ? '' : 's'}${bad ? `, ${bad} skipped` : ''}.`);
    } catch { toast('That file is not a backup from this app.'); }
    input.value = '';
  };
  fr.onerror = () => toast('Could not read that file.');
  fr.readAsText(f);
}

function updateBackupNote() {
  const el = $('#bkNote');
  const n = Object.keys(COL).length + Object.keys(CUS).length + Object.keys(TGT).length;
  const last = LS.get('lastExport', 0);
  el.hidden = !(n && (!last || Date.now() - last > 14 * DAY));
  if (el.hidden) return;
  el.replaceChildren('Your cards are saved only in this browser. ', last ? `Last backup: ${fmtDate(last)}. ` : 'You have not made a backup yet. ',
    h('button', { type: 'button', class: 'linkbtn', onclick: exportAll }, 'Download a backup'));
}

}

function applyHome() {
  const nq = norm(F.q), digits = /^\d+$/.test(nq), compact = nq.replace(/ /g, '');
  const g = F.gen ? S.gens.find(x => x.n === F.gen) : null;
  let n = 0; F.first = null;
  for (const sp of S.species) {
    let ok = true;
    if (g) ok = sp.id >= g.lo && sp.id <= g.hi;
    if (ok && nq) ok = digits ? String(sp.id).startsWith(nq) : (sp.key.includes(nq) || sp.compact.includes(compact));
    if (ok && F.own === 'have') ok = S.ownByDex.has(sp.id);
    if (ok && F.own === 'missing') ok = !S.ownByDex.has(sp.id);
    sp.tile.hidden = !ok;
    if (ok) { n++; if (!F.first) F.first = sp; }
  }
  $('#homeCount').textContent = n.toLocaleString() + ' Pokémon';
  $('#homeEmpty').hidden = n > 0;
}

function showHome() {
  setMode('home');
  V = null;
  closeLightboxUI();
  applyHome();
  updateBackupNote();
  document.title = 'Pokédex Printings';
}

function setMode(m) {
  $('#home').hidden = m !== 'home';
  $('#poke').hidden = m !== 'poke';
  $('#binder').hidden = m !== 'binder';
  $('#searchWrap').hidden = m !== 'home';
  $('#genChips').hidden = m !== 'home';
  if (m === 'binder') $('#binderLink').setAttribute('aria-current', 'page'); else $('#binderLink').removeAttribute('aria-current');
}

/* ---------- Pokémon page ---------- */
function showPoke(id, cardId) {
  setMode('poke');
  if (V && V.id === id) {
    if (cardId && !V.cardId) V.lbBack = true;
    syncLightbox(cardId);
    return;
  }
  const sp = S.byId.get(id);
  closeLightboxUI();
  if (!sp) {
    V = null;
    $('#poke').replaceChildren(h('p', { class: 'state' }, 'That Pokédex number is not in the list. ', h('a', { href: '#/' }, 'Back to the Pokédex')));
    return;
  }
  const v = V = {
    id, sp, token: ++S.token, cards: null, visible: [], how: 'tcgdex', hidden: 0,
    sort: LS.get('sort', 'new'), rarity: null, own: 'all', cardId: cardId || null, lbBack: false,
    caps: new Map(), pockets: new Map(), el: {}
  };
  document.title = sp.name + ' printings · Pokédex Printings';
  renderShell(v);
  populate(v);
}

function renderShell(v) {
  const sp = v.sp, i = S.species.indexOf(sp);
  const prev = S.species[i - 1], next = S.species[i + 1];

  v.el.meta = h('p', { class: 'hero-meta' }, 'Loading printings…');
  v.el.status = h('p', { class: 'status', role: 'status', 'aria-live': 'polite' });
  v.el.chips = h('div', { class: 'chips wrap', role: 'group', 'aria-label': 'Filter by rarity' });
  v.el.grid = h('div', { class: 'gallery' });
  v.el.empty = h('p', { class: 'state', hidden: true }, 'No printings match that filter.');

  const sort = h('select', { id: 'sortSel', onchange: e => { v.sort = e.target.value; LS.set('sort', v.sort); renderGallery(v); } },
    h('option', { value: 'new' }, 'Newest first'), h('option', { value: 'old' }, 'Oldest first'), h('option', { value: 'price' }, 'Highest price'));
  sort.value = v.sort;

  const ownSel = h('select', { id: 'ownSel', onchange: e => { v.own = e.target.value; renderGallery(v); } },
    h('option', { value: 'all' }, 'All printings'), h('option', { value: 'have' }, 'In my collection'), h('option', { value: 'missing' }, 'Not in my collection'), h('option', { value: 'binder' }, 'In the selected binder'), h('option', { value: 'target' }, 'On my target list'));

  const cw = LS.get('cw', 150);
  document.documentElement.style.setProperty('--cw', cw + 'px');
  const size = h('input', {
    id: 'sizeRange', type: 'range', min: 100, max: 280, step: 10, value: cw,
    oninput: e => { document.documentElement.style.setProperty('--cw', e.target.value + 'px'); LS.set('cw', +e.target.value); }
  });

  $('#poke').replaceChildren(
    h('nav', { class: 'crumbs', 'aria-label': 'Pokémon navigation' },
      h('a', { class: 'back', href: '#/' }, '← All Pokémon'),
      h('span', { class: 'pn' },
        prev ? h('a', { href: '#/p/' + prev.id, rel: 'prev' }, '‹ ' + prev.name) : null,
        next ? h('a', { href: '#/p/' + next.id, rel: 'next' }, next.name + ' ›') : null)),
    h('div', { class: 'hero' },
      h('img', { class: 'hero-art', src: ART(sp.id), alt: '', width: 112, height: 112, onerror: e => { e.target.style.visibility = 'hidden'; } }),
      h('div', null, h('p', { class: 'dexno' }, 'No. ' + pad(sp.id)), h('h1', null, sp.name), v.el.meta)),
    h('div', { class: 'controls' },
      h('div', { class: 'row' },
        h('label', { class: 'field', for: 'sortSel' }, 'Order', sort),
        h('label', { class: 'field', for: 'ownSel' }, 'Show', ownSel),
        h('label', { class: 'field', for: 'sizeRange' }, 'Card size', size)),
      h('div', { class: 'row' },
        h('label', { class: 'field' }, 'Binder buttons add to', binderSelect()),
        h('button', { type: 'button', class: 'btn ghost sm', id: 'addPrinting', onclick: () => openCardForm(v) }, '+ Add a printing')),
      v.el.chips),
    v.el.status, v.el.grid, v.el.empty);
  scrollTo(0, 0);
}

async function populate(v) {
  const alive = () => V === v;
  try {
    const res = await loadCards(v.sp);
    if (!alive()) return;
    v.cards = res.cards.concat(customsFor(v.id)); v.how = res.how; v.hidden = res.hidden || 0;
    if (!v.cards.length) {
      v.el.meta.textContent = 'No printings found for this Pokémon.' + (v.hidden ? ` (${v.hidden} Pocket cards hidden)` : '');
      return;
    }
    renderGallery(v); updateMeta(v);
    if (v.cardId) openLightbox(v.cardId);
    enrich(v);
  } catch (e) {
    if (!alive()) return;
    v.el.meta.textContent = 'Could not load printings.';
    v.el.grid.replaceChildren(h('div', { class: 'state', style: 'grid-column:1/-1' },
      'The card database did not respond (' + (e && e.message || 'network error') + '). ',
      h('button', { type: 'button', class: 'btn', onclick: () => { v.el.meta.textContent = 'Loading printings…'; v.el.grid.replaceChildren(); populate(v); } }, 'Try again')));
  }
}

async function enrich(v) {
  const alive = () => V === v;
  if (v.cards.every(c => c.pre)) { buildChips(v); updateMeta(v); return; }

  const needSets = [...new Set(v.cards.filter(c => !c.pre).map(c => c.setId))].filter(id => !S.setMeta[id]);
  if (needSets.length) {
    let n = 0;
    status(v, `Looking up release dates · 0 of ${needSets.length}`);
    await pool(needSets, 6, async id => {
      const s = await getJSON(`${API}/sets/${encodeURIComponent(id)}`);
      S.setMeta[id] = [s.releaseDate || '', (s.serie && s.serie.name) || '', (s.serie && s.serie.id) || ''];
      status(v, `Looking up release dates · ${++n} of ${needSets.length}`);
    }, alive);
    LS.set('sm', S.setMeta);
    if (!alive()) return;
    /* belt and braces: drop any set the series data says is TCG Pocket */
    const before = v.cards.length;
    v.cards = v.cards.filter(c => (S.setMeta[c.setId] || [])[2] !== 'tcgp');
    if (v.cards.length !== before) { v.hidden += before - v.cards.length; S.cards.get(v.id).cards = v.cards.filter(c => !c.custom); }
    renderGallery(v); updateMeta(v);
  }

  const need = v.cards.filter(c => !c.pre && !fresh(S.details[c.id]));
  if (need.length) {
    let n = 0;
    status(v, `Reading rarity, artist and prices · 0 of ${need.length}`);
    await pool(need, 8, async c => {
      await fetchDetail(c.id);
      n++;
      syncOwned(c);
      const cap = v.caps.get(c.id);
      if (cap && alive()) fillCap(cap, c);
      if (n % 20 === 0) { status(v, `Reading rarity, artist and prices · ${n} of ${need.length}`); if (alive()) buildChips(v); }
    }, alive);
    persistDetails();
  }
  if (!alive()) return;
  status(v, '');
  buildChips(v); updateMeta(v);
  if (v.rarity || v.sort === 'price') renderGallery(v);
}

function status(v, t) { if (V === v) v.el.status.textContent = t; }

function updateMeta(v) {
  if (!v.cards) return;
  const n = v.cards.length;
  const sets = new Set(v.cards.map(c => c.setId)).size;
  const dates = v.cards.map(dateOf).filter(Boolean).sort();
  const parts = [`${n} printing${n === 1 ? '' : 's'}`, `${sets} set${sets === 1 ? '' : 's'}`];
  if (dates.length) {
    const a = dates[0].slice(0, 4), b = dates[dates.length - 1].slice(0, 4);
    parts.push(a === b ? a : `${a}–${b}`);
  }
  const art = v.cards.filter(c => isArtRare(rarityOf(c))).length;
  if (art) parts.push(`${art} art rare${art === 1 ? '' : 's'}`);
  const have = v.cards.filter(c => COL[c.id]).length;
  if (have) parts.push(`${have} in your collection`);
  const tg = v.cards.filter(c => TGT[c.id]).length;
  if (tg) parts.push(`${tg} on your target list`);
  const bn = activeB(), inb = v.cards.filter(c => inB(bn, c.id)).length;
  if (inb) parts.push(`${inb} in “${bn.name}”`);
  v.el.meta.textContent = parts.join(' · ')
    + (v.how === 'ptcg' ? ' · via Pokémon TCG API' : '')
    + (v.hidden ? ` · ${v.hidden} Pocket card${v.hidden === 1 ? '' : 's'} hidden` : '');
}

function buildChips(v) {
  const counts = new Map();
  let art = 0;
  for (const c of v.cards) {
    const r = rarityOf(c);
    if (!r) continue;
    counts.set(r, (counts.get(r) || 0) + 1);
    if (isArtRare(r)) art++;
  }
  if (!counts.size) { v.el.chips.replaceChildren(); return; }
  const items = [['', 'All', v.cards.length]];
  if (art) items.push(['__art', 'Art rares', art]);
  [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).forEach(([r, n]) => items.push([r, r, n]));
  v.el.chips.replaceChildren(...items.map(([key, label, n]) => h('button', {
    type: 'button', class: 'chip', 'aria-pressed': String((v.rarity || '') === key),
    onclick: () => { v.rarity = key || null; buildChips(v); renderGallery(v); }
  }, label, h('i', null, n))));
}

function renderGallery(v) {
  if (V !== v || !v.cards) return;
  v.visible = visibleCards(v);
  v.caps = new Map();
  v.pockets = new Map();
  const frag = document.createDocumentFragment();
  for (const c of v.visible) frag.append(pocket(v, c));
  v.el.grid.replaceChildren(frag);
  v.el.empty.hidden = v.visible.length > 0;
}

function pocket(v, c) {
  const alt = `${c.name}, ${setName(c)} ${c.localId}`;
  const art = c.thumb
    ? h('img', {
        src: c.thumb, alt, width: 245, height: 337, loading: 'lazy', decoding: 'async',
        onerror: e => { const i = e.target; if (c.thumbAlt && !i.dataset.p) { i.dataset.p = '1'; i.src = c.thumbAlt; } }
      })
    : h('div', { class: 'noimg' }, h('span', null, c.name), h('small', null, 'No image'));
  const cap = h('span', { class: 'cap' });
  const yr = yearOf(c);
  const link = h('a', { class: 'pk-link', href: `#/p/${v.id}/${encodeURIComponent(c.id)}` },
    h('span', { class: 'art' }, art),
    h('span', { class: 'set', title: setName(c) }, setName(c) + (yr ? ' · ' + yr : '')));
  const own = h('button', { type: 'button', class: 'own', onclick: () => toggleCol(v, c) });
  const bnd = h('button', { type: 'button', class: 'bnd', onclick: () => toggleBnd(v, c) }, bookIcon());
  const tgt = h('button', { type: 'button', class: 'tgt', onclick: () => toggleTgt(v, c) });
  const el = h('div', { class: 'pocket', dataset: { cid: c.id } }, link, cap, h('div', { class: 'pk-btns' }, own, bnd, tgt));
  v.caps.set(c.id, cap);
  v.pockets.set(c.id, el);
  fillCap(cap, c);
  syncPocket(el, c);
  return el;
}

function fillCap(cap, c) {
  const r = rarityOf(c), pr = primaryPrice(c);
  cap.replaceChildren(
    h('span', null, numLabel(c)),
    c.lang ? h('span', { class: 'lang' }, c.lang) : null,
    r ? h('span', { class: isArtRare(r) ? 'art-r' : '' }, (glyph(r) ? glyph(r) + ' ' : '') + r) : null,
    pr != null ? h('span', { class: 'price' }, money(pr)) : null);
}

/* ---------- card viewer ---------- */
let lastFocus = null;

function syncLightbox(cardId) {
  if (!cardId) { V.cardId = null; closeLightboxUI(); return; }
  if (V.cards) openLightbox(cardId); else V.cardId = cardId;
}

function openLightbox(cardId) {
  const v = V;
  const c = v.cards.find(x => x.id === cardId);
  if (!c) { v.cardId = null; return; }
  v.cardId = cardId;
  v.lastCard = cardId;
  const lb = $('#lb');
  if (lb.hidden) { lastFocus = document.activeElement; }
  lb.hidden = false;
  document.documentElement.classList.add('lb-open');
  lb.scrollTop = 0;

  $('#lbImg').replaceChildren(c.full
    ? h('img', {
        src: c.full, alt: `${c.name}, ${setName(c)} ${numLabel(c)}`,
        onerror: e => { const i = e.target; if (c.fullAlt && !i.dataset.p) { i.dataset.p = '1'; i.src = c.fullAlt; } }
      })
    : h('div', { class: 'noimg' }, h('span', null, c.name), h('small', null, 'No image')));

  const info = $('#lbInfo');
  const draw = full => {
    if (V !== v || v.cardId !== cardId) return;
    const loading = !c.pre && full === undefined;
    const r = rarityOf(c), ill = illustratorOf(c), series = seriesOf(c), logo = logoOf(c);
    const pl = pricesOf(c), upd = priceUpdated(c);

    const rows = [['Set', setName(c) + (yearOf(c) ? ' · ' + yearOf(c) : '')], ['Number', numLabel(c)]];
    if (series) rows.splice(1, 0, ['Series', series]);
    if (c.lang) rows.push(['Language', c.lang]);
    rows.push(
      ['Rarity', r ? (glyph(r) ? glyph(r) + ' ' : '') + r : (loading ? 'Loading…' : '—')],
      ['Illustrator', ill || (loading ? 'Loading…' : '—')]);
    if (!c.custom || pl.length) {
      rows.push([c.custom ? 'My price' : 'Market price', pl.length
        ? h('span', { class: 'tags' }, pl.map(([k, m]) => h('span', { class: 'tag' }, c.custom ? money(m) : priceLabel(k) + ' ' + money(m))))
        : (loading ? 'Loading…' : 'Not listed')]);
    }
    const fin = c.pre ? c.finishes
      : (full && full.variants ? Object.entries(full.variants).filter(([, on]) => on === true).map(([k]) => VAR_LABEL[k] || k) : []);
    if (fin && fin.length) rows.push(['Finishes', h('span', { class: 'tags' }, fin.map(t => h('span', { class: 'tag' }, t)))]);
    if (c.custom && c.note) rows.push(['Notes', c.note]);

    const acts = [
      h('button', { type: 'button', id: 'lbCol', class: 'btn', onclick: () => toggleCol(v, c) }),
      h('button', { type: 'button', id: 'lbBnd', class: 'btn', onclick: () => toggleBnd(v, c) }),
      h('button', { type: 'button', id: 'lbTgt', class: 'btn ghost', onclick: () => toggleTgt(v, c) }),
      BND.list.length > 1 ? binderSelect() : null,
      c.custom ? null : h('a', { class: 'btn ghost', href: tcgUrl(c), target: '_blank', rel: 'noopener noreferrer' }, c.tcgUrl ? 'View on TCGplayer ↗' : 'Search TCGplayer ↗'),
      c.custom ? h('button', { type: 'button', id: 'lbEdit', class: 'btn ghost', onclick: () => openCardForm(v, c) }, 'Edit') : null,
      c.custom ? h('button', {
        type: 'button', id: 'lbDel', class: 'btn ghost',
        onclick: e => {
          const b = e.currentTarget;
          if (b.dataset.arm) { deleteCustom(v, c); return; }
          b.dataset.arm = '1'; b.textContent = 'Click again to delete';
          setTimeout(() => { if (b.isConnected) { delete b.dataset.arm; b.textContent = 'Delete'; } }, 4000);
        }
      }, 'Delete') : null
    ];

    info.replaceChildren(
      h('h2', null, c.name),
      h('p', { class: 'sub mono' }, c.custom ? 'Added by me' : c.id.replace(/^p:/, '')),
      h('div', { class: 'lb-actions' }, acts),
      h('dl', null, rows.map(([k, val]) => [h('dt', null, k), h('dd', null, val)])),
      pl.length && !c.custom ? h('p', { class: 'note' }, 'TCGplayer market price' + (fmtDate(upd) ? ', updated ' + fmtDate(upd) : '') + '.') : null,
      logo ? h('img', { class: 'lb-logo', src: logo, alt: '', onerror: e => { e.target.hidden = true; } }) : null);
    syncLb(c);
  };
  draw(c.pre ? undefined : S.full.get(c.id));
  if (!c.pre && !S.full.has(c.id)) {
    fetchDetail(c.id).then(f => { persistDetails(); syncOwned(c); const cap = v.caps.get(c.id); if (cap) fillCap(cap, c); draw(f); }).catch(() => draw(null));
  }

  const multi = (v.visible.length || v.cards.length) > 1;
  $('#lbPrev').hidden = $('#lbNext').hidden = !multi;
  $('#lbClose').focus({ preventScroll: true });
}

function lbList() {
  const v = V;
  return v.visible.some(x => x.id === v.cardId) ? v.visible : sortCards(v);
}

function lbStep(d) {
  if (!V || !V.cardId) return;
  const list = lbList();
  const i = list.findIndex(x => x.id === V.cardId);
  if (i < 0 || list.length < 2) return;
  const nx = list[(i + d + list.length) % list.length];
  location.replace(`#/p/${V.id}/${encodeURIComponent(nx.id)}`);
}

function lbClose() {
  if (!V) return;
  if (V.lbBack) { V.lbBack = false; history.back(); }
  else location.replace('#/p/' + V.id);
}

function closeLightboxUI() {
  const lb = $('#lb');
  if (lb.hidden) return;
  lb.hidden = true;
  document.documentElement.classList.remove('lb-open');
  $('#lbImg').replaceChildren();
  if (V && V.el.grid) {
    const el = [...V.el.grid.children].find(x => x.dataset && x.dataset.cid === V.lastCard);
    const target = el && el.querySelector('.pk-link');
    if (target) { target.focus({ preventScroll: true }); if (target.scrollIntoView) target.scrollIntoView({ block: 'nearest' }); return; }
  }
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}

$('#lbClose').addEventListener('click', lbClose);
$('#lbPrev').addEventListener('click', () => lbStep(-1));
$('#lbNext').addEventListener('click', () => lbStep(1));
$('#lb').addEventListener('click', e => { if (e.target === $('#lb')) lbClose(); });
document.addEventListener('keydown', e => {
  if (document.getElementById('cf')) {   // the add-a-printing form is open
    if (e.key === 'Escape') { e.preventDefault(); closeCardForm(); }
    return;
  }
  const open = !$('#lb').hidden;
  if (open) {
    if (e.key === 'Escape') { e.preventDefault(); lbClose(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); lbStep(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); lbStep(1); }
    return;
  }
  if (e.key === '/' && mode === 'home' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
});
let tx = null;
$('#lbPanel').addEventListener('touchstart', e => { tx = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
$('#lbPanel').addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) lbStep(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- my cards page: collection tab and one tab per binder ---------- */
let curTab = null;

function showBinder(key) {
  setMode('binder');
  V = null;
  closeLightboxUI();
  document.title = 'My cards · Pokédex Printings';
  renderBinder(key);
}

function tabKey(key) {
  if (key === 'col' || key === 'tgt') return key;
  if (key && BND.list.some(b => b.id === key)) return key;
  const saved = LS.get('tab', '');
  if (saved === 'col' || saved === 'tgt' || BND.list.some(b => b.id === saved)) return saved;
  return BND.active;
}

const dexOf = it => (it.rec ? it.rec.d : it.sp.id);

/* one binder's cards in Pokédex order, optionally with a blank slot for every Pokémon that has none */
function binderItems(b) {
  const by = new Map();
  b.cards.forEach(id => {
    const r = COL[id];
    if (!r) return;
    if (!by.has(r.d)) by.set(r.d, []);
    by.get(r.d).push({ id, rec: r });
  });
  if (!b.ph) return [...by.keys()].sort((x, y) => x - y).flatMap(d => by.get(d));
  const out = [];
  for (const sp of S.species) {
    const a = by.get(sp.id);
    if (a) { out.push(...a); by.delete(sp.id); } else out.push({ sp });
  }
  for (const d of [...by.keys()].sort((x, y) => x - y)) out.push(...by.get(d));
  return out;
}

function slotFor(it) {
  if (it.rec) {
    const r = it.rec, img = r.cu ? customImg(it.id) : r.th;
    return h('a', { class: 'slot filled', href: `#/p/${r.d}/${encodeURIComponent(it.id)}`, title: `${r.n} · ${r.s} ${r.no}` },
      img ? h('img', { src: img, alt: `${r.n}, ${r.s} ${r.no}`, loading: 'lazy', decoding: 'async' }) : h('span', { class: 'slot-txt' }, r.n),
      h('span', { class: 'sl-no' }, pad(r.d)));
  }
  const sp = it.sp;
  return h('a', { class: 'slot empty', href: '#/p/' + sp.id, title: sp.name + ' · empty' },
    h('img', { src: SPRITE(sp.id), alt: '', loading: 'lazy', decoding: 'async' }),
    h('span', { class: 'sl-no' }, pad(sp.id)),
    h('span', { class: 'sl-nm' }, sp.name));
}

function renderBinder(key) {
  const k = tabKey(key || curTab);
  curTab = k;
  LS.set('tab', k);
  if (k !== 'col' && k !== 'tgt' && BND.active !== k) { BND.active = k; saveBnd(); refreshBsels(); }

  const tabs = h('nav', { class: 'chips wrap', 'aria-label': 'Collection and binders' },
    h('a', { class: 'chip', href: '#/binder/col', 'aria-current': k === 'col' ? 'page' : null }, 'Collection', h('i', null, Object.keys(COL).length)),
    h('a', { class: 'chip', href: '#/binder/tgt', 'aria-current': k === 'tgt' ? 'page' : null }, 'Targets', h('i', null, Object.keys(TGT).length)),
    BND.list.map(b => h('a', {
      class: 'chip', href: '#/binder/' + encodeURIComponent(b.id), 'aria-current': k === b.id ? 'page' : null
    }, b.name, h('i', null, b.cards.filter(id => COL[id]).length))),
    h('button', { type: 'button', class: 'chip add', id: 'newBinder', onclick: newBinder }, '+ New binder'));

  $('#binder').replaceChildren(
    h('div', { class: 'bhead' }, h('h1', null, 'My cards')),
    tabs,
    k === 'col' ? collectionView() : k === 'tgt' ? targetsView() : binderView(BND.list.find(b => b.id === k)),
    backupView());
}

function newBinder() {
  if (BND.list.length >= 30) { toast('That is plenty of binders already.'); return; }
  const b = { id: newId('b'), name: 'Binder ' + (BND.list.length + 1), rows: 3, cols: 3, ph: false, cards: [] };
  BND.list.push(b);
  BND.active = b.id;
  saveBnd(); refreshBsels();
  location.hash = '#/binder/' + encodeURIComponent(b.id);
}

function deleteBinder(b) {
  BND.list = BND.list.filter(x => x.id !== b.id);
  BND.active = BND.list[0].id;
  saveBnd(); refreshBsels();
  toast('Deleted “' + b.name + '”. Its cards are still in your collection.');
  location.replace('#/binder/' + encodeURIComponent(BND.active));
}

function binderView(b) {
  const items = binderItems(b), per = b.rows * b.cols;
  const filled = items.filter(i => i.rec);
  const covered = new Set(filled.map(i => i.rec.d)).size;
  const value = filled.reduce((s, i) => s + (typeof i.rec.p === 'number' ? i.rec.p : 0), 0);
  const pages = Math.ceil(items.length / per);
  const total = S.species.length;

  const num = (id, label, val, on) => {
    const sel = h('select', { id, onchange: e => on(+e.target.value) }, [1, 2, 3, 4, 5, 6].map(n => h('option', { value: n }, n)));
    sel.value = String(val);
    return h('label', { class: 'field', for: id }, label, sel);
  };
  const name = h('input', {
    type: 'text', id: 'bName', class: 'bname', maxlength: 40, value: b.name, 'aria-label': 'Binder name',
    onchange: e => { b.name = e.target.value.trim().slice(0, 40) || 'Binder'; saveBnd(); refreshBsels(); renderBinder(); }
  });
  const jump = h('input', {
    id: 'jumpNo', class: 'jump', type: 'number', min: 1, max: total, inputmode: 'numeric', placeholder: 'No.', 'aria-label': 'Jump to Pokédex number',
    onkeydown: e => {
      if (e.key !== 'Enter') return;
      const n = +e.target.value, i = items.findIndex(it => dexOf(it) >= n);
      const el = i >= 0 ? $('#bp-' + Math.floor(i / per)) : null;
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
    }
  });
  const del = BND.list.length > 1 ? h('button', {
    type: 'button', class: 'btn ghost sm', id: 'delBinder',
    onclick: e => {
      const el = e.currentTarget;
      if (el.dataset.arm) { deleteBinder(b); return; }
      el.dataset.arm = '1'; el.textContent = 'Click again to delete';
      setTimeout(() => { if (el.isConnected) { delete el.dataset.arm; el.textContent = 'Delete binder'; } }, 4000);
    }
  }, 'Delete binder') : null;

  const ctl = h('div', { class: 'bctl' },
    h('label', { class: 'field', for: 'bName' }, 'Name', name),
    num('bCols', 'Columns', b.cols, n => { b.cols = n; saveBnd(); renderBinder(); }),
    num('bRows', 'Rows', b.rows, n => { b.rows = n; saveBnd(); renderBinder(); }),
    h('label', { class: 'field', for: 'jumpNo' }, 'Jump to', jump),
    del);
  const ph = h('label', { class: 'chk' },
    h('input', { type: 'checkbox', id: 'bPh', checked: b.ph, onchange: e => { b.ph = e.target.checked; saveBnd(); renderBinder(); } }),
    'Leave a blank slot for every Pokémon I don’t have in this binder yet');

  const sheet = h('div', { class: 'bpages', style: `grid-template-columns:repeat(auto-fill,minmax(min(100%,${Math.max(280, b.cols * 74)}px),1fr))` });
  for (let p = 0; p < pages; p++) {
    const part = items.slice(p * per, p * per + per), cells = part.map(slotFor);
    for (let i = part.length; i < per; i++) cells.push(h('div', { class: 'slot blank', 'aria-hidden': 'true' }));
    sheet.append(h('section', { class: 'bpage', id: 'bp-' + p },
      h('h3', null, 'Page ' + (p + 1), h('span', null, `No. ${pad(dexOf(part[0]))}–${pad(dexOf(part[part.length - 1]))}`)),
      h('div', { class: 'bgrid', style: `--bc:${b.cols}` }, cells)));
  }

  return h('div', null,
    ctl, ph,
    h('p', { class: 'bsum', style: 'margin-top:12px' },
      h('b', null, filled.length.toLocaleString()), ` card${filled.length === 1 ? '' : 's'} · `,
      h('b', null, covered.toLocaleString()), ` Pokémon · ${b.rows} × ${b.cols} pockets, `, h('b', null, String(pages)), ` page${pages === 1 ? '' : 's'} · about `,
      h('b', null, money(value)), ' at TCGplayer market prices'),
    b.ph ? h('div', { class: 'bprog', role: 'img', 'aria-label': `${covered} of ${total} Pokémon in this binder` },
      h('span', { style: `width:${total ? (covered / total * 100).toFixed(1) : 0}%` })) : null,
    h('p', { class: 'bnote' }, 'Cards sit in Pokédex order. Add one from any Pokémon page with the book button on its card.'),
    items.length ? sheet : h('p', { class: 'state' }, 'Nothing in this binder yet. Open a Pokémon and tap the book button on a card to put it here.'));
}

function collectionView() {
  const recs = Object.entries(COL).map(([id, r]) => ({ id, ...r })).sort((a, b) => a.d - b.d || a.t - b.t);
  const value = recs.reduce((s, r) => s + (typeof r.p === 'number' ? r.p : 0), 0);
  const grid = h('div', { class: 'gallery' });
  const empty = h('p', { class: 'state', hidden: true }, 'No cards match that.');
  const draw = q => {
    const nq = norm(q);
    const list = nq ? recs.filter(r => norm(r.n + ' ' + r.s + ' ' + r.r).includes(nq)) : recs;
    grid.replaceChildren(...list.map(colTile));
    empty.hidden = list.length > 0 || !recs.length;
  };
  draw('');
  return h('div', null,
    h('p', { class: 'bsum', style: 'margin-top:14px' },
      h('b', null, recs.length.toLocaleString()), ` card${recs.length === 1 ? '' : 's'} · `,
      h('b', null, S.ownByDex.size.toLocaleString()), ` of ${S.species.length.toLocaleString()} Pokémon · about `, h('b', null, money(value)), ' at TCGplayer market prices'),
    recs.length ? h('div', { class: 'bctl' },
      h('label', { class: 'field', for: 'colq' }, 'Filter', h('input', { type: 'search', id: 'colq', class: 'colq', placeholder: 'Name, set or rarity', oninput: e => draw(e.target.value) }))) : null,
    recs.length ? grid : h('p', { class: 'state' }, 'No cards yet. Open a Pokémon and tap + on a card you own.'),
    empty);
}

function colTile(r) {
  const img = r.cu ? customImg(r.id) : r.th;
  const inN = BND.list.filter(b => inB(b, r.id)).length;
  return h('div', { class: 'pocket owned' },
    h('a', { class: 'pk-link', href: `#/p/${r.d}/${encodeURIComponent(r.id)}` },
      h('span', { class: 'art' }, img
        ? h('img', { src: img, alt: `${r.n}, ${r.s} ${r.no}`, width: 245, height: 337, loading: 'lazy', decoding: 'async' })
        : h('div', { class: 'noimg' }, h('span', null, r.n), h('small', null, 'No image'))),
      h('span', { class: 'set', title: r.s }, r.s + (r.y ? ' · ' + r.y : ''))),
    h('span', { class: 'cap' }, h('span', null, r.n), h('span', null, r.no),
      r.r ? h('span', { class: isArtRare(r.r) ? 'art-r' : '' }, r.r) : null,
      typeof r.p === 'number' ? h('span', { class: 'price' }, money(r.p)) : null,
      inN ? h('span', null, `In ${inN} binder${inN === 1 ? '' : 's'}`) : null));
}

function gotIt(id, toBinder) {
  const r = TGT[id];
  if (!r) return;
  COL[id] = { ...r, t: Date.now() };
  delete TGT[id];
  const b = activeB();
  if (toBinder && !b.cards.includes(id)) { b.cards.push(id); saveBnd(); }
  saveCol(); saveTgt(); askPersist();
  rebuildOwn(); refreshTileBadges(); updateBinderBadge();
  toast(toBinder ? `Moved to your collection and “${b.name}”.` : 'Moved to your collection.');
  renderBinder();
}

function dropTarget(id) {
  delete TGT[id];
  saveTgt();
  renderBinder();
}

function targetsText(list, total) {
  const lines = list.map(r => `${r.n} — ${r.s}${r.y ? ' (' + r.y + ')' : ''} ${r.no}${typeof r.p === 'number' ? ' — ' + money(r.p) : ''}`);
  return lines.join('\n') + `\n\n${list.length} card${list.length === 1 ? '' : 's'}, about ${money(total)}`;
}

function targetsView() {
  const key = LS.get('tsort', 'dex');
  const cmp = {
    dex: (a, b) => a.d - b.d || a.t - b.t,
    price: (a, b) => (typeof b.p === 'number' ? b.p : -1) - (typeof a.p === 'number' ? a.p : -1) || a.d - b.d,
    new: (a, b) => b.t - a.t
  }[key] || ((a, b) => a.d - b.d);
  const list = Object.entries(TGT).map(([id, r]) => ({ id, ...r })).sort(cmp);
  const total = list.reduce((s, r) => s + (typeof r.p === 'number' ? r.p : 0), 0);
  const unpriced = list.filter(r => typeof r.p !== 'number').length;

  if (!list.length) return h('p', { class: 'state' }, 'No targets yet. Tap the ☆ on any card to add it here. Cards you add to your collection leave this list on their own.');

  const sel = h('select', { id: 'tSort', onchange: e => { LS.set('tsort', e.target.value); renderBinder(); } },
    h('option', { value: 'dex' }, 'Pokédex order'), h('option', { value: 'price' }, 'Highest price first'), h('option', { value: 'new' }, 'Newest added first'));
  sel.value = key;
  const copy = h('button', {
    type: 'button', class: 'btn ghost sm', id: 'copyTargets',
    onclick: async () => {
      try { await navigator.clipboard.writeText(targetsText(list, total)); toast('Copied the list.'); }
      catch { toast('Could not copy. Your browser blocked it.'); }
    }
  }, 'Copy list');

  return h('div', null,
    h('p', { class: 'bsum', style: 'margin-top:14px' },
      h('b', null, list.length.toLocaleString()), ` card${list.length === 1 ? '' : 's'} to find · about `, h('b', null, money(total)),
      ' at TCGplayer market prices' + (unpriced ? ` (${unpriced} without a price)` : '')),
    h('div', { class: 'toolbar' }, h('label', { class: 'field', for: 'tSort' }, 'Order', sel), copy),
    h('div', { class: 'gallery' }, list.map(tgtTile)));
}

function tgtTile(r) {
  const img = r.cu ? customImg(r.id) : r.th;
  return h('div', { class: 'pocket' },
    h('a', { class: 'pk-link', href: `#/p/${r.d}/${encodeURIComponent(r.id)}` },
      h('span', { class: 'art' }, img
        ? h('img', { src: img, alt: `${r.n}, ${r.s} ${r.no}`, width: 245, height: 337, loading: 'lazy', decoding: 'async' })
        : h('div', { class: 'noimg' }, h('span', null, r.n), h('small', null, 'No image'))),
      h('span', { class: 'set', title: r.s }, r.s + (r.y ? ' · ' + r.y : ''))),
    h('span', { class: 'cap' }, h('span', null, r.n), h('span', null, r.no),
      r.r ? h('span', { class: isArtRare(r.r) ? 'art-r' : '' }, r.r) : null,
      typeof r.p === 'number' ? h('span', { class: 'price' }, money(r.p)) : null),
    h('div', { class: 'tg-acts' },
      h('button', { type: 'button', class: 'btn sm got', 'aria-label': 'Got it: ' + r.n + ' ' + r.no, onclick: () => gotIt(r.id, false) }, 'Got it'),
      h('button', { type: 'button', class: 'btn ghost sm gotb', title: `Got it, and put it in “${activeB().name}”`, 'aria-label': 'Got it and add to binder: ' + r.n + ' ' + r.no, onclick: () => gotIt(r.id, true) }, '+ binder'),
      h('button', { type: 'button', class: 'btn ghost sm x', 'aria-label': 'Remove from target list: ' + r.n + ' ' + r.no, onclick: () => dropTarget(r.id) }, '×')));
}

function backupView() {
  const last = LS.get('lastExport', 0);
  return h('div', { class: 'backup' },
    h('h2', null, 'Back up your cards'),
    h('p', null, 'Your collection, binders and custom printings (with photos) are saved in this browser on this device only, so clearing site data or switching devices loses them. '
      + (last ? 'Last backup: ' + fmtDate(last) + '.' : 'No backup yet.') + ' Download a copy now and then. Import merges a saved copy back in.'),
    h('div', { class: 'row' },
      h('button', { type: 'button', class: 'btn', id: 'exportBtn', onclick: exportAll }, 'Download a backup'),
      h('label', { class: 'btn ghost file' }, 'Import a backup', h('input', { type: 'file', accept: 'application/json,.json', class: 'sr', onchange: importFile }))));
}

/* ---------- routing ---------- */
function route() {
  const hash = location.hash;
  let m;
  if ((m = /^#\/p\/(\d+)(?:\/(.+))?$/.exec(hash))) {
    if (mode === 'home') homeY = window.scrollY;
    if (mode === 'binder') binderY = window.scrollY;
    showPoke(+m[1], m[2] ? decodeURIComponent(m[2]) : null);
    mode = 'poke';
  } else if ((m = /^#\/binder(?:\/(.+))?$/.exec(hash))) {
    const from = mode;
    if (mode === 'home') homeY = window.scrollY;
    showBinder(m[1] ? decodeURIComponent(m[1]) : null);
    mode = 'binder';
    if (from === 'poke') requestAnimationFrame(() => scrollTo(0, binderY)); else scrollTo(0, 0);
  } else {
    if (mode === 'binder') binderY = window.scrollY;
    showHome();
    if (mode !== 'home') requestAnimationFrame(() => scrollTo(0, homeY));
    mode = 'home';
  }
}
addEventListener('hashchange', route);

/* ---------- boot ---------- */
$('#q').addEventListener('input', e => { F.q = e.target.value; applyHome(); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && F.first) { e.target.blur(); location.hash = '#/p/' + F.first.id; }
});
$('#ownFilter').addEventListener('change', e => { F.own = e.target.value; applyHome(); });

async function boot() {
  const bootEl = $('#boot');
  bootEl.hidden = false;
  bootEl.textContent = 'Loading the Pokédex…';
  try {
    LS.del('cd');   // cache from an earlier version of this app
    loadMine();
    S.pocketReady = loadPocketSets();
    const [species, sets] = await Promise.all([loadSpecies(), loadSets().catch(() => []), ImgStore.init()]);
    S.species = species.map(([id, slug]) => {
      const name = pretty(slug), key = norm(name);
      return { id, slug, name, key, compact: key.replace(/ /g, '') };
    });
    S.byId = new Map(S.species.map(sp => [sp.id, sp]));
    S.sets = sets;
    S.setsById = new Map(sets.map(s => [s.id, s]));
    S.setIndex = new Map(sets.map((s, i) => [s.id, i]));
    rebuildOwn();
    buildHome();
    refreshTileBadges();
    updateBinderBadge();
    applyHome();
    bootEl.hidden = true;
    route();
  } catch (e) {
    bootEl.replaceChildren('Could not load the Pokémon list (' + (e && e.message || 'network error') + '). ',
      h('button', { type: 'button', class: 'btn', onclick: boot }, 'Try again'));
  }
}
boot();
})();
</script>
</body>
</html>
